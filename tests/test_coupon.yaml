# 测试优惠券相关函数的步骤
- url: /api/ping
  method: get
  expect:
    json=@msg: pong
- url: /api/v2/auth/password
  method: post
  args:
    json@phone: "15348247596"
    json@password: "991028"
    json@code: "bd280dc9def725507c62736e15665166b63cc3de0d02092aafba93558c06a3a6"
  expect:
    json=@msg: 修改用户密码成功
- url: /api/v2/auth/login
  method: post
  args:
    json@phone: "15348247596"
    json@password: "991028"
  expect:
    json=@msg: 登录成功
  action:
    json@accessToken: senv@admin_token
- url: /api/v2/auth/user
  method: post
  args:
    json@name: testuser
    json@phone: "14348247597"
    json@password: "123456"
  expect:
    json=@msg: 新增用户成功
- url: /api/v2/auth/login
  method: post
  args:
    json@phone: "14348247597"
    json@password: "123456"
  expect:
    json=@msg: 登录成功
  action:
    json@accessToken: senv@token
- url: /api/v2/coupon/list
  method: get
  args:
    header@wanshouhotelt: genv@token
  expect:
    json@length@data: 0
- url: /api/v2/coupon/admin/list
  method: get
  args:
    header@wanshouhotelt: genv@admin_token
  expect:
    json@length@data: 2
- url: /api/v2/coupon/admin/distrib
  method: post
  args:
    header@wanshouhotelt: genv@admin_token
    json@coupon_id: 1
    json@phone: "14348247597"
    json@times: 1
    json@period_day: 30
  expect:
    json=@msg: "优惠券分发成功"
- url: /api/v2/coupon/list
  method: get
  args:
    header@wanshouhotelt: genv@token
  expect:
    json@length@data: 1