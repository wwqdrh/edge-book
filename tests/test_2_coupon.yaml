# 测试优惠券相关函数的步骤
- url: /api/v2/coupon/list
  method: get
  args:
    header@wanshouhotelt: genv@token
  expect:
    json@length@data: 0
- url: /api/v2/coupon/admin/list
  method: get
  args:
    header@wanshouhotelt: genv@admin_token
  expect:
    json@length@data: 2
- url: /api/v2/coupon/admin/distrib
  method: post
  args:
    header@wanshouhotelt: genv@admin_token
    json@coupon_id: 1
    json@phone: genv@user_phone
    json@times: 1
    json@period_day: 30
  expect:
    json=@msg: "优惠券分发成功"
- url: /api/v2/coupon/list
  method: get
  args:
    header@wanshouhotelt: genv@token
  expect:
    json@length@data: 1
  action:
    json@data.0.id: senv@user_coupon_first_id
- url: /api/v2/coupon/admin/revoke
  method: post
  args:
    header@wanshouhotelt: genv@admin_token
    json@instanceid: genv@user_coupon_first_id
  expect:
    json=@msg: "优惠券撤销成功"
- url: /api/v2/coupon/list
  method: get
  args:
    header@wanshouhotelt: genv@token
  expect:
    json@length@data: 0
